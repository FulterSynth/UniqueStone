<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UniqueStone v0.1.0</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #1a1a2e;
      color: #eee;
      height: 100vh;
      overflow: hidden;
    }

    /* ===== ЕКРАН ЗАВАНТАЖЕННЯ ===== */
    #loader {
      position: fixed;
      inset: 0;
      background: #1a1a2e;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 9999;
      flex-direction: column;
      gap: 16px;
    }
    #loader-status { font-size: 18px; color: #aaa; }
    .spinner {
      width: 40px; height: 40px;
      border: 4px solid #333;
      border-top-color: #e94560;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* ===== ЕКРАН ВХОДУ ===== */
    #auth-screen {
      display: none;
      height: 100vh;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .auth-card {
      background: #16213e;
      border-radius: 16px;
      padding: 32px 28px;
      width: 100%;
      max-width: 380px;
      box-shadow: 0 8px 32px rgba(0,0,0,0.4);
    }
    .auth-tabs {
      display: flex;
      margin-bottom: 24px;
      background: #0f1a2e;
      border-radius: 10px;
      padding: 4px;
    }
    .auth-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      border-radius: 8px;
      cursor: pointer;
      font-weight: 600;
      color: #888;
      transition: 0.2s;
      border: none;
      background: transparent;
      font-size: 15px;
    }
    .auth-tab.active {
      background: #e94560;
      color: #fff;
    }
    .auth-input {
      width: 100%;
      padding: 12px 14px;
      margin-bottom: 12px;
      border-radius: 10px;
      border: 1px solid #2a3a5e;
      background: #0f1a2e;
      color: #eee;
      font-size: 15px;
      outline: none;
      transition: 0.2s;
    }
    .auth-input:focus { border-color: #e94560; }
    .auth-btn {
      width: 100%;
      padding: 13px;
      border-radius: 10px;
      border: none;
      background: #e94560;
      color: #fff;
      font-weight: 700;
      font-size: 16px;
      cursor: pointer;
      transition: 0.2s;
      margin-top: 8px;
    }
    .auth-btn:hover { background: #d63a54; }
    .auth-btn:disabled { opacity: 0.6; cursor: not-allowed; }
    #auth-error {
      color: #ff6b6b;
      font-size: 14px;
      margin-top: 12px;
      min-height: 18px;
      text-align: center;
    }

    /* ===== ГОЛОВНИЙ ЕКРАН ===== */
    #main-screen {
      display: none;
      height: 100vh;
      flex-direction: column;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 16px;
      background: #16213e;
      border-bottom: 1px solid #2a3a5e;
    }
    .top-bar .user-email {
      font-size: 13px;
      color: #aaa;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 60%;
    }
    .logout-btn {
      padding: 6px 14px;
      border-radius: 8px;
      border: 1px solid #e94560;
      background: transparent;
      color: #e94560;
      font-size: 13px;
      cursor: pointer;
      transition: 0.2s;
    }
    .logout-btn:hover { background: #e94560; color: #fff; }

    .content-area {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }
    .tab-content { display: none; }
    .tab-content.active { display: block; }
    .tab-content h2 {
      font-size: 22px;
      margin-bottom: 16px;
      color: #e94560;
    }
    .placeholder-box {
      background: #16213e;
      border-radius: 12px;
      padding: 24px;
      color: #666;
      text-align: center;
      border: 1px dashed #2a3a5e;
    }

    /* ===== НИЖНЯ НАВІГАЦІЯ (стиль Clash Royale) ===== */
    .bottom-nav {
      display: flex;
      background: #16213e;
      border-top: 2px solid #2a3a5e;
      padding: 6px 0;
    }
    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 8px 0;
      background: transparent;
      border: none;
      cursor: pointer;
      color: #666;
      transition: 0.2s;
      position: relative;
    }
    .nav-btn .nav-icon { font-size: 24px; }
    .nav-btn .nav-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
    }
    .nav-btn.active { color: #e94560; }
    .nav-btn.active::before {
      content: '';
      position: absolute;
      top: -6px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 3px;
      background: #e94560;
      border-radius: 3px;
    }
  </style>
</head>
<body>

  <!-- ЕКРАН ЗАВАНТАЖЕННЯ -->
  <div id="loader">
    <div class="spinner"></div>
    <h2 id="loader-status">UniqueStone v0.1.0</h2>
  </div>

  <!-- ЕКРАН ВХОДУ / РЕЄСТРАЦІЇ -->
  <div id="auth-screen">
    <div class="auth-card">
      <div class="auth-tabs">
        <button class="auth-tab active" id="tab-login" data-mode="login">Вхід</button>
        <button class="auth-tab" id="tab-register" data-mode="register">Реєстрація</button>
      </div>
      <input type="email" class="auth-input" id="auth-email" placeholder="Email" autocomplete="email">
      <input type="password" class="auth-input" id="auth-password" placeholder="Пароль (мін. 6 символів)" autocomplete="current-password">
      <button class="auth-btn" id="auth-submit">Увійти</button>
      <div id="auth-error"></div>
    </div>
  </div>

  <!-- ГОЛОВНИЙ ЕКРАН -->
  <div id="main-screen">
    <div class="top-bar">
      <span class="user-email" id="user-email">—</span>
      <button class="logout-btn" id="logout-btn">Вийти</button>
    </div>

    <div class="content-area">
      <div class="tab-content active" id="tab-content-mine">
        <h2>⛏️ Шахта</h2>
        <div class="placeholder-box">Тут буде контент шахти (заглушка)</div>
      </div>
      <div class="tab-content" id="tab-content-chat">
        <h2>💬 Чат</h2>
        <div class="placeholder-box">Тут буде чат (заглушка)</div>
      </div>
      <div class="tab-content" id="tab-content-market">
        <h2>📈 Біржа</h2>
        <div class="placeholder-box">Тут буде біржа (заглушка)</div>
      </div>
    </div>

    <div class="bottom-nav">
      <button class="nav-btn active" data-tab="mine">
        <span class="nav-icon">⛏️</span>
        <span class="nav-label">Шахта</span>
      </button>
      <button class="nav-btn" data-tab="chat">
        <span class="nav-icon">💬</span>
        <span class="nav-label">Чат</span>
      </button>
      <button class="nav-btn" data-tab="market">
        <span class="nav-icon">📈</span>
        <span class="nav-label">Біржа</span>
      </button>
    </div>
  </div>

  <script type="module">
    // ===== ІМПОРТ FIREBASE =====
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
    import {
      getAuth,
      signInWithEmailAndPassword,
      createUserWithEmailAndPassword,
      onAuthStateChanged,
      signOut
    } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

    // ===== КОНФІГ FIREBASE (без analytics) =====
    const firebaseConfig = {
      apiKey: "AIzaSyDGltUohufVAc-FMIbO1sIvpd6xWSiaKdU",
      authDomain: "uniquestone.firebaseapp.com",
      projectId: "uniquestone",
      storageBucket: "uniquestone.firebasestorage.app",
      messagingSenderId: "114557024409",
      appId: "1:114557024409:web:23f1e0ad213e9cf7d2e008"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const CURRENT_VERSION = "0.1.0";
    document.getElementById('loader-status').innerText = "UniqueStone v" + CURRENT_VERSION;

    // ===== ЕЛЕМЕНТИ =====
    const loader = document.getElementById('loader');
    const authScreen = document.getElementById('auth-screen');
    const mainScreen = document.getElementById('main-screen');
    const authEmail = document.getElementById('auth-email');
    const authPassword = document.getElementById('auth-password');
    const authSubmit = document.getElementById('auth-submit');
    const authError = document.getElementById('auth-error');
    const tabLogin = document.getElementById('tab-login');
    const tabRegister = document.getElementById('tab-register');
    const userEmailSpan = document.getElementById('user-email');
    const logoutBtn = document.getElementById('logout-btn');

    // ===== СТАН =====
    let authMode = 'login'; // 'login' | 'register'

    // ===== ПЕРЕМИКАННЯ ВКЛАДОК ВХОДУ =====
    function setAuthMode(mode) {
      authMode = mode;
      authError.textContent = '';
      if (mode === 'login') {
        tabLogin.classList.add('active');
        tabRegister.classList.remove('active');
        authSubmit.textContent = 'Увійти';
      } else {
        tabRegister.classList.add('active');
        tabLogin.classList.remove('active');
        authSubmit.textContent = 'Зареєструватися';
      }
    }
    tabLogin.addEventListener('click', () => setAuthMode('login'));
    tabRegister.addEventListener('click', () => setAuthMode('register'));

    // ===== ОБРОБКА ВХОДУ / РЕЄСТРАЦІЇ =====
    authSubmit.addEventListener('click', async () => {
      const email = authEmail.value.trim();
      const password = authPassword.value;

      authError.textContent = '';

      if (!email || !password) {
        authError.textContent = 'Заповни email і пароль.';
        return;
      }
      if (password.length < 6) {
        authError.textContent = 'Пароль має бути мінімум 6 символів.';
        return;
      }

      authSubmit.disabled = true;
      try {
        if (authMode === 'login') {
          await signInWithEmailAndPassword(auth, email, password);
        } else {
          await createUserWithEmailAndPassword(auth, email, password);
        }
        // Успіх — onAuthStateChanged сам перемкне екран
        authEmail.value = '';
        authPassword.value = '';
      } catch (err) {
        authError.textContent = translateError(err.code);
      } finally {
        authSubmit.disabled = false;
      }
    });

    // ===== ПЕРЕКЛАД ПОМИЛОК FIREBASE =====
    function translateError(code) {
      switch (code) {
        case 'auth/invalid-email': return 'Неправильний формат email.';
        case 'auth/user-not-found': return 'Користувача з таким email не знайдено.';
        case 'auth/wrong-password': return 'Невірний пароль.';
        case 'auth/invalid-credential': return 'Невірний email або пароль.';
        case 'auth/email-already-in-use': return 'Цей email вже зареєстрований.';
        case 'auth/weak-password': return 'Пароль занадто слабкий (мін. 6 символів).';
        case 'auth/too-many-requests': return 'Забагато спроб. Спробуй пізніше.';
        case 'auth/network-request-failed': return 'Немає з\'єднання з інтернетом.';
        default: return 'Помилка: ' + code;
      }
    }

    // ===== ПЕРЕМИКАННЯ НИЖНЬОЇ НАВІГАЦІЇ =====
    const navBtns = document.querySelectorAll('.nav-btn');
    const tabContents = {
      mine: document.getElementById('tab-content-mine'),
      chat: document.getElementById('tab-content-chat'),
      market: document.getElementById('tab-content-market')
    };
    navBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        const tab = btn.dataset.tab;
        navBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        Object.values(tabContents).forEach(el => el.classList.remove('active'));
        tabContents[tab].classList.add('active');
      });
    });

    // ===== ВИХІД =====
    logoutBtn.addEventListener('click', () => {
      signOut(auth);
    });

    // ===== СТАН КОРИСТУВАЧА =====
    onAuthStateChanged(auth, (user) => {
      loader.style.display = 'none';
      if (user) {
        userEmailSpan.textContent = user.email;
        authScreen.style.display = 'none';
        mainScreen.style.display = 'flex';
      } else {
        authScreen.style.display = 'flex';
        mainScreen.style.display = 'none';
        setAuthMode('login');
      }
    });
  </script>

</body>
</html>
